#
# Local Antora playbook for Boost.Accumulators
#
# site.url is baked into canonical links, sitemap, and Lunr-related output. Set it
# to the base URL where this site is actually served, or keep a separate playbook
# (e.g. publish-playbook.yml) for production while this file targets preview/staging.

site:
  title: Boost.Accumulators
  url: https://antora.cppalliance.org/develop/lib/doc
  start_page: accumulators::index.adoc
  robots: allow
  keys:
    repo_url: 'https://github.com/boostorg/accumulators'

content:
  sources:
    - url: ..
      start_path: doc
      edit_url: 'https://github.com/boostorg/accumulators/edit/{refname}/{path}'

ui:
  bundle:
    url: https://github.com/boostorg/website-v2-docs/releases/download/ui-master/ui-bundle.zip
    snapshot: true

antora:
  extensions:
    - require: '@antora/lunr-extension' # https://gitlab.com/antora/antora-lunr-extension
      index_latest_only: true
    # MrDocs reference must register before cpp-tagfiles: both listen on contentAggregated;
    # tagfiles consumes playbook.runtime.cppReferenceTagfileRegistry on that event (see
    # extension tests). At --log-level=debug you may still see one early "No cpp-reference
    # tagfile registry" from cpp-tagfiles' beforeProcess hook; the registry loads on contentAggregated.
    - require: '@cppalliance/antora-cpp-reference-extension'
      dependencies:
        - name: 'boost'
          repo: 'https://github.com/boostorg/boost.git'
          tag: 'develop'
          variable: 'BOOST_SRC_DIR'
          system-env: 'BOOST_SRC_DIR'
    - require: '@cppalliance/antora-cpp-tagfiles-extension'
      cpp-tagfiles:
        using-namespaces:
          - 'boost::'
    - require: '@cppalliance/antora-downloads-extension'

asciidoc:
  attributes:
    # Enable pagination
    page-pagination: ''
    source-highlighter: none
  extensions:
    - '@cppalliance/asciidoctor-boost-links'
    - '@asciidoctor/tabs'
